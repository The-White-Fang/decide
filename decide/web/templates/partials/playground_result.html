{% if error %}
<div class="w-full p-4 bg-rose-950/60 border border-rose-800 text-rose-200 rounded-lg text-xs font-mono">
    <strong>Error:</strong> {{ error }}
</div>
{% else %}
<div class="w-full space-y-3">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <span class="text-xs text-slate-400">Target Device: <strong class="text-indigo-400">{{ device }}</strong></span>
        <span class="px-2 py-0.5 bg-emerald-950 text-emerald-300 border border-emerald-800 rounded-full text-xs font-semibold">
            ⚡ {{ latency_ms }} ms
        </span>
    </div>
    <pre class="bg-slate-950 p-4 rounded-lg overflow-x-auto text-emerald-400 text-xs font-mono">{{ result }}</pre>
</div>
{% endif %}
