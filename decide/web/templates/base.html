<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}decide - GLiNER2.5 Inference Appliance{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <script src="/static/js/htmx.min.js"></script>
</head>
<body class="h-full flex flex-col font-sans antialiased">
    <nav class="bg-slate-800/80 border-b border-slate-700/60 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="/admin" class="flex items-center space-x-2 text-indigo-400 font-bold text-xl tracking-tight">
                        <span class="p-1.5 bg-indigo-600/20 border border-indigo-500/40 rounded-lg">⚡</span>
                        <span>decide</span>
                    </a>
                    {% if admin %}
                    <div class="hidden md:flex space-x-4">
                        <a href="/admin" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 text-slate-200">Dashboard</a>
                        <a href="/admin/playground" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-700 text-slate-200">Playground</a>
                    </div>
                    {% endif %}
                </div>
                {% if admin %}
                <div class="flex items-center space-x-4">
                    <span class="text-xs text-slate-400">Admin: <strong class="text-slate-200">{{ admin.username }}</strong></span>
                    <form action="/admin/logout" method="post" class="inline">
                        <button type="submit" class="text-xs px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 transition">Logout</button>
                    </form>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <div id="modal-container"></div>
</body>
</html>
