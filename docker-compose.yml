services:
    decide:
        build: .
        image: decide:latest
        container_name: decide-appliance
        ports:
            - '8000:8000'
        environment:
            # Administrative login credentials
            - ADMIN_USERNAME=admin
            - ADMIN_PASSWORD=
            - FORCE_ADMIN_RESET=false
            # Compute engine target: auto | cpu | cuda
            - DEVICE=auto
            # Concurrency: 1 worker recommended for PyTorch VRAM safety
            - WORKERS=1
            # Storage location
            - DATABASE_PATH=/data/decide.db
        volumes:
            - decide_data:/data
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s

        # Uncomment below to reserve NVIDIA GPU when running with NVIDIA Container Toolkit
        # deploy:
        #   resources:
        #     reservations:
        #       devices:
        #         - driver: nvidia
        #           count: 1
        #           capabilities: [gpu]

volumes:
    decide_data:
